 conditions.</title><rect x="401" y="283" width="178" height="84" rx="3" fill="#edc8ad"/><text x="415" y="307" font-family="monospace" font-size="9" fill="#334436">Biology</text><text x="415" y="332" font-family="Georgia,serif" font-size="13" fill="#23332b">Homeostasis</text></g><g><title></title><rect x="357.78173828125" y="241.3472137451172" width="178" height="84" rx="3" fill="#c3c4eb"/><text x="371.78173828125" y="265.3472137451172" font-family="monospace" font-size="9" fill="#334436">Physics</text><text x="371.78173828125" y="290.3472137451172" font-family="Georgia,serif" font-size="13" fill="#23332b">Entropy</text></g><text x="30" y="635" fill="#b7c7ac" font-family="monospace" font-size="10">THREAD / IDEAS TRAVEL BETWEEN CLASSES</text></svg>